    <!-- nosemgrep -->
    <link rel="dns-prefetch" href="https://storage.ko-fi.com" />

    <!--
      Mirrors the Content-Security-Policy in src/_headers so the dev server gets
      the same policy. frame-ancestors is deliberately omitted: it is ignored in
      a meta element, and is delivered as a real header in production.

      The font origins are for FontPresetsService.loadWebFont, which fetches a
      font only when someone picks one for the preview. Nothing is fetched on
      load; the UI itself uses the platform font stack.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://storage.ko-fi.com https://pagead2.googlesyndication.com https://googleads.g.doubleclick.net https://tpc.googlesyndication.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; connect-src 'self' https://pagead2.googlesyndication.com https://googleads.g.doubleclick.net; font-src 'self' https://fonts.gstatic.com; frame-src https://googleads.g.doubleclick.net https://tpc.googlesyndication.com https://www.google.com; base-uri 'self'; form-action 'self'; object-src 'none';" />

    <script>
      (() => {
        try {
          const saved = localStorage.getItem('confitty-theme');
          const dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.classList.toggle('light', !dark);
        } catch (_) {}
      })();
    </script>

    <style>
      html { background: #0d0d0d; color-scheme: dark; }
      html.light { background: #f6f5f3; color-scheme: light; }
      body { margin: 0; background: inherit; }
      app-root { display: block; min-height: 100vh; }

      /*
       * Angular replaces everything inside app-root on bootstrap, so this is
       * only ever seen while the bundle loads, by a crawler that does not run
       * scripts, or by someone who has turned them off. Worth being a real
       * description of the tool rather than a bare spinner.
       */
      .boot {
        display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 20px; min-height: 100vh;
        padding: 24px; text-align: center; background: inherit;
        font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: #e0e0e0;
      }
      html.light .boot { color: #1c1917; }
      .boot h1 { margin: 0; font-size: 1.5rem; font-weight: 600; letter-spacing: -0.01em; }
      .boot p { margin: 0; max-width: 46ch; color: #909090; }
      html.light .boot p { color: #736d68; }
      .boot a { color: #ffb5c6; }
      html.light .boot a { color: #cb3379; }
      .boot__spinner {
        width: 32px; height: 32px;
        border: 3px solid rgba(255, 181, 198, 0.2);
        border-top-color: #ffb5c6;
        border-radius: 50%;
        animation: spin 900ms linear infinite;
      }
      html.light .boot__spinner {
        border-color: rgba(203, 51, 121, 0.2);
        border-top-color: #cb3379;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        .boot__spinner { animation: none; opacity: 0.6; }
      }
    </style>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Confitty",
      "alternateName": "Confitty for Kitty Terminal",
      "url": "https://confitty.app/",
      "description": "Visual configuration builder for Kitty terminal with live preview, 40+ color themes, and smart diff export.",
      "applicationCategory": "DeveloperApplication",
      "operatingSystem": "Web",
      "browserRequirements": "Requires a modern browser with JavaScript enabled",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
      "author": { "@type": "Person", "name": "xcutiboo", "url": "https://github.com/xcutiboo" },
      "publisher": {
        "@type": "Organization",
        "name": "Confitty",
        "logo": { "@type": "ImageObject", "url": "https://confitty.app/assets/confitty.svg" }
      },
      "image": "https://confitty.app/assets/confitty-og.png",
      "screenshot": "https://confitty.app/assets/confitty-og.png",
      "featureList": [
        "Live terminal preview",
        "47 built-in color themes",
        "Visual editor for 230+ kitty.conf options",
        "Import existing kitty.conf",
        "Smart diff export (only changed values)",
        "Tab bar, cursor, font, and window controls"
      ],

      "isAccessibleForFree": true,

      "datePublished": "2025-03-04"
    }
    </script>

    <script

      crossorigin="anonymous"
      defer
    ></script>
  </head>
  <body>
    <app-root>
      <div class="boot">
        <h1>Confitty</h1>
        <p>
          A visual configuration builder for the
          <a href="https://sw.kovidgoyal.net/kitty/">Kitty terminal</a>. Edit 231
          settings with a live terminal preview, then export a
          <code>kitty.conf</code> containing only what you changed. It runs
          entirely in your browser, with no account and no backend.
        </p>
        <div class="boot__spinner" role="status" aria-label="Loading the editor"></div>
        <noscript>
          <p>
            Confitty needs JavaScript: it builds and previews your configuration
            in the browser rather than on a server. The
            <a href="https://github.com/xcutiboo/Confitty">source is on GitHub</a>,
            and Kitty's own
            <a href="https://sw.kovidgoyal.net/kitty/conf/">configuration reference</a>
            documents every option it edits.
          </p>
        </noscript>
      </div>
    </app-root>
