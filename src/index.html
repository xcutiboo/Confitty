    <script>
      (function () {
        try {
          var saved = localStorage.getItem('confitty-theme');
          var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.classList.toggle('light', !dark);
        } catch (_) {}
      })();
    </script>

    <style>
      html { background: #0d0d0d; }
      html.light { background: #f6f5f3; }
      body { margin: 0; background: inherit; }
      app-root { display: block; min-height: 100vh; }
      .app-loader {
        display: flex; align-items: center; justify-content: center;
        min-height: 100vh; background: inherit;
      }
      .app-loader__spinner {
        width: 36px; height: 36px;
        border: 3px solid rgba(236, 72, 153, 0.18);
        border-top-color: #ec4899;
        border-radius: 50%;
        animation: spin 900ms linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        .app-loader__spinner { animation: none; border-top-color: rgba(236, 72, 153, 0.6); }
      }
    </style>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is Confitty?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Confitty is a visual configuration builder for Kitty terminal. It lets you tweak settings, preview the result live, and export a minimal kitty.conf that only includes values that differ from Kitty's defaults."
          }
        },
        {
          "@type": "Question",
          "name": "Is Confitty free?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Confitty is free and open source under the MIT license."
          }
        },
        {
          "@type": "Question",
          "name": "How do I apply the exported kitty.conf?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Save the exported file to ~/.config/kitty/kitty.conf and reload Kitty with Ctrl+Shift+F5."
          }
        },
        {
          "@type": "Question",
          "name": "Which themes ship with Confitty?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Confitty includes Dracula, Nord, Tokyo Night, Catppuccin variants, Gruvbox, Kanagawa, Ayu, Monokai, Solarized, VS Code, GitHub, iTerm2, and the original Confitty themes."
          }
        },
        {
          "@type": "Question",
          "name": "Can I import an existing kitty.conf?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Click Import and select your kitty.conf, and Confitty parses it and populates the visual editor."
          }
        }
      ]
    }
