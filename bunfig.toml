[install]
registry = "https://registry.npmjs.org/"

# Pin exact versions: the lockfile is the record, and a caret in package.json
# only invites drift between a local install and CI.
exact = true

# Refuse packages published in the last seven days. Compromised releases are
# usually caught and yanked within hours, so a short quarantine removes most of
# the exposure to a hijacked publish at close to no cost.
minimumReleaseAge = 604800
