name: CI

on:
  push:
    branches: [confitty]
  pull_request:
    branches: [confitty]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NX_CLOUD_ACCESS_TOKEN: ""
  NX_NO_CLOUD: "true"
  NX_DAEMON: "false"

jobs:
  build:
    name: Type check, test, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Matches the Node version Cloudflare Pages builds with, so CI and the
      # deployed artefact come off the same runtime.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install

      - name: Type check
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      - name: Production build
        run: bun run build:prod
